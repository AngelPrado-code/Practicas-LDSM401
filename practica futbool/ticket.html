<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket de Reservación</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<section class="card">
    <h2>Estadio</h2>
    <p class="linea-detalle"><strong>RFC:</strong> <span id="salidaRfc">---</span></p>
    <p class="linea-detalle"><strong>Cliente:</strong> <span id="salidaCliente">---</span></p>
    <hr class="mi_linea">
    <h3>Detalle de la reservación:</h3>
<article class="linea-detalle">
    <span>Adultos:</span>
    <span id="salidaAdultos">0</span>
</article>
<article class="linea-detalle">
    <span>Niños:</span>
    <span id="salidaNinos">0</span>
</article>
<article class="linea-detalle">
    <span>Zona:</span>
    <span id="salidaZona">---</span>
</article>
<article class="linea-detalle">
    <span>Subtotal:</span>
    <span id="salidaSubtotal">$0.00</span>
</article>
<article class="linea-detalle">
    <span>IVA (16%):</span>
    <span id="salidaIva">$0.00</span>
</article>
<article class="linea-detalle total-destacado">
    <span>Total a pagar:</span>
    <span id="salidaTotal">$0.00</span>
</article>
</section>
<script src="js/ticket.js"></script>
</body>
</html>
