<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sueldos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <main class="container mt-5">
        <article class="mb-3">
            <a href="index.html" class="btn btn-secondary">Volver</a>
        </article>
        <section class="row justify-content-center">
            <article class="col-12 col-md-6">
                <article id="cSueldos" class="card">
                    <article class="card-header text-center">
                        <h2>Sueldos</h2>
                    </article>
                    <section class="card-body">
                        <label>Puesto</label>
                        <select id="puesto" class="form-select">
                            <option value="0">Diseñador</option>
                            <option value="1">Programador</option>
                            <option value="2">Líder</option>
                        </select>

                        <label>Nivel</label>
                        <select id="nivel" class="form-select">
                            <option value="0">New</option>
                            <option value="1">Jr</option>
                            <option value="2">Sr</option>
                        </select>

                        <label>Horas</label>
                        <input id="horas" type="number" class="form-control">

                        <button id="bSueldos" class="btn btn-primary" onclick="calcular();">Calcular</button>
                    </section>
                    <article class="card-footer text-center">
                        <h3>Total</h3>
                        <article id="impTotal"></article>
                    </article>
                </article>
            </article>
        </section>
    </main>
    <script src="js/arreglos.js"></script>
</body>
</html>
