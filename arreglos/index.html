<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Numero de muertes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>

    <main class="container mt-5">
        <h1 class="text-center mb-4">Arreglos</h1>
        <section class="row g-3">

            <article class="col-12 col-md-4">
                <article class="card text-center">
                    <article class="card-header">
                        <h2>Numero de Muertes</h2>
                    </article>
                    <section class="card-body">
                        <button class="btn btn-primary" onclick="muertes();">Capturar Muertes</button>
                    </section>
                    <article class="card-footer">
                        <h3>Impresiones</h3>
                        <article id="impMuertes"></article>
                    </article>
                </article>
            </article>

            <article class="col-12 col-md-4">
                <article class="card text-center">
                    <article class="card-header">
                        <h2>Eliminar Alumno</h2>
                    </article>
                    <section class="card-body">
                        <button class="btn btn-primary" onclick="alumnos();">Agregar</button>
                        <button class="btn btn-primary" onclick="eliminarA();">Eliminar</button>
                    </section>
                    <article class="card-footer">
                        <h3>Impresiones</h3>
                        <article id="impAlumnos"></article>
                        <article id="impAlumnosFinal"></article>
                    </article>
                </article>
            </article>

            <article class="col-12 col-md-4">
                <article class="card text-center">
                    <article class="card-header">
                        <h2>Letra E</h2>
                    </article>
                    <section class="card-body">
                        <article id="impMatriz"></article>
                    </section>
                </article>
            </article>

            <article class="col-12">
                <article id="cSueldos" class="card">
                    <article class="card-header text-center">
                        <h2>Sueldos</h2>
                    </article>
                    <section class="card-body">
                        <label>Puesto</label>
                        <select id="puesto" class="form-select">
                            <option value="0">Diseñador</option>
                            <option value="1">Programador</option>
                            <option value="2">Líder</option>
                        </select>

                        <label>Nivel</label>
                        <select id="nivel" class="form-select">
                            <option value="0">New</option>
                            <option value="1">Jr</option>
                            <option value="2">Sr</option>
                        </select>

                        <label>Horas</label>
                        <input id="horas" type="number" class="form-control">

                        <button id="bSueldos" class="btn btn-primary" onclick="calcular();">Calcular</button>
                    </section>
                    <article class="card-footer">
                        <h3>Total</h3>
                        <article id="impTotal"></article>
                    </article>
                </article>
            </article>

            <article class="col-12">
                <article class="card">
                    <article class="card-header text-center">
                        <h2>Agenda</h2>
                    </article>
                    <section class="card-body">
                        <label>Día</label>
                        <select id="diaA" class="form-select">
                            <option value="0">Lunes</option>
                            <option value="1">Martes</option>
                            <option value="2">Miércoles</option>
                            <option value="3">Jueves</option>
                            <option value="4">Viernes</option>
                            <option value="5">Sábado</option>
                            <option value="6">Domingo</option>
                        </select>

                        <label>Hora</label>
                        <input id="horaA" type="time" class="form-control">

                        <label>Evento</label>
                        <input id="eventoA" type="text" class="form-control">

                        <label>Descripción</label>
                        <textarea id="descA" class="form-control"></textarea>

                        <button class="btn btn-primary" onclick="guardar();">Guardar</button>
                    </section>
                    <article class="card-footer">
            
                        <article id="impAgenda"></article>
                    </article>
                </article>
            </article>

            

        </section>
    </main>

    <script src="js/arreglos.js"></script>
</body>
</html>
