<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link href="css/estilo.css" rel="stylesheet">
</head>
<body>
    <main class="container mt-5">
        <article class="mb-3">
            <a href="index.html" class="btn btn-secondary">Volver</a>
        </article>
        <section class="row justify-content-center">
            <article class="col-12 col-md-8">
                <article class="card">
                    <article class="card-header text-center">
                        <h2>Agenda</h2>
                    </article>
                    <section class="card-body">
                        <label>Día</label>
                        <select id="diaA" class="form-select">
                            <option value="0">Lunes</option>
                            <option value="1">Martes</option>
                            <option value="2">Miercoles</option>
                            <option value="3">Jueves</option>
                            <option value="4">Viernes</option>
                            <option value="5">Sabado</option>
                            <option value="6">Domingo</option>
                        </select>

                        <label>Hora</label>
                        <input id="horaA" type="time" class="form-control">

                        <label>Evento</label>
                        <input id="eventoA" type="text" class="form-control">

                        <label>Descripción</label>
                        <textarea id="descA" class="form-control"></textarea>

                        <button class="btn btn-primary mt-3" onclick="guardar();">Guardar</button>
                    </section>
                    <article class="card-footer">
                        <article id="impAgenda"></article>
                    </article>
                </article>
            </article>
        </section>
    </main>
    <script src="js/arreglos.js"></script>
</body>
</html>
